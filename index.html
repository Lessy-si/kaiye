<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1812" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="开页" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch.png" />
    <title>开页</title>
    <link rel="stylesheet" href="./css/app.css?v=37" />
    <script>
      try {
        var pack = localStorage.getItem("kaiye-pack") || "ielts";
        var pref = localStorage.getItem("kaiye-eye");
        var child = pack === "ket" || pack === "g5";
        if (pref === "on" || (!pref && child)) document.documentElement.dataset.eye = "on";
      } catch (e) {}
    </script>
  </head>
  <body data-theme="ielts">
    <div class="app" id="app">
      <header class="top">
        <div class="brand">
          <b id="brand-title">开页</b>
          <span id="brand-sub">IELTS Academic</span>
        </div>
        <div class="shelf" id="shelf" role="tablist" aria-label="练习册"></div>
      </header>
      <nav class="nav" id="nav" aria-label="学习块"></nav>
      <main id="main"></main>
    </div>
    <nav class="dock" id="dock" aria-label="手机导航"></nav>
    <p class="toast" id="toast" hidden></p>
    <input id="portrait-file" class="hidden" type="file" accept="image/*" capture="user" />
    <script type="module" src="./js/app.js?v=37"></script>
  </body>
</html>
